services:
  mongodb:
    image: mongo:latest
    container_name: bd2_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:4.1
    container_name: bd2_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch

  neo4j:
    image: neo4j:latest
    container_name: bd2_neo4j
    ports:
      - "7474:7474" # Interfaz Web (por si querés ver el grafo visualmente)
      - "7687:7687" # Protocolo Bolt (para la consola)
    environment:
      - NEO4J_AUTH=neo4j/uade1234
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:alpine
    container_name: bd2_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
